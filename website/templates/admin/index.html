{% extends "base.html" %}

{% block content %}
<h1>Customers</h1>

<a href="{{ url_for('auth.signup') }}">Add customer</a>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Address</th>
      <th>Email</th>
      <th>Phone</th>
    </tr>
  </thead>
  <tbody>
    {% for customer in data.customers %}
    <tr>
      <td>{{ customer.id }}</td>
      <td>{{ customer.name }}</td>
      <td>{{ customer.address }}</td>
      <td>{{ customer.email }}</td>
      <td>{{ customer.phone }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5">No customers yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
