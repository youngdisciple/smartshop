{% extends "base.html" %}
{% block title %}Add customer · SmartShop{% endblock %}
{% block content %}
<header class="page-header"><div><h1>Add customer</h1><p>Create an account and add a customer to your directory.</p></div><a class="text-link" href="{{ url_for('admin.index_customer') }}">View customers →</a></header>
<section class="panel signup-panel" aria-labelledby="details-heading">
  <header class="panel-header"><h2 id="details-heading">Customer details</h2><span class="page-note">All fields required except phone</span></header>
  <form class="customer-form" method="post" action="{{ url_for('auth.signup') }}">
    <div class="form-grid">
      <div class="field"><label for="name">First name</label><input type="text" id="name" name="name" autocomplete="given-name" required></div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required></div>
      <div class="field full-width"><label for="address">Address</label><input type="text" id="address" name="address" autocomplete="street-address" required></div>
      <div class="field full-width"><label for="phone">Phone <span class="optional">(optional)</span></label><input type="tel" id="phone" name="phone" autocomplete="tel"></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" minlength="6" autocomplete="new-password" aria-describedby="password-help" required><p class="help" id="password-help">Use at least 6 characters.</p></div>
      <div class="field"><label for="confirm_password">Confirm password</label><input type="password" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required></div>
    </div>
    <div class="form-actions"><button type="submit">Create customer</button><a href="{{ url_for('admin.index_customer') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
