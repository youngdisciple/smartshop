<section class="panel scanner-panel"><h2>{{ _('Scanner tools') }}</h2>{% if show_upc %}<p>{{ _('Scan a barcode into UPC and press Tab, or enter it manually') }}</p>{% endif %}<div class="actions">{% if show_upc %}<button type="button" id="lookup-upc">{{ _('Look up UPC') }}</button>{% endif %}<button type="button" id="capture-epc">{{ _('Capture EPC') }}</button><button type="button" id="cancel-capture">{{ _('Stop scan') }}</button></div><p id="scanner-status" role="status" aria-live="polite" data-multiple="{{ _('Present only one product tag') }}" data-starting="{{ _('Starting product reader…') }}" data-waiting="{{ _('Reader armed. Present one tag; waiting for an EPC.') }}" data-connection="{{ _('Connection interrupted') }}" data-upc-prompt="{{ _('Scan or enter a UPC first, then click Look up UPC.') }}"></p></section>
